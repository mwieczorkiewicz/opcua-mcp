services:
  opcua-server:
    image: mcr.microsoft.com/iot/opc-ua-test-server:2.8
    command: ["--sample", "--port", "4840"]
    ports:
      - "4840:4840"

  opcua-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - opcua-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_TRANSPORT: http
      SERVER_HTTP_PORT: "8080"
      OPCUA_ENDPOINT: opc.tcp://opcua-server:4840
      OPCUA_AUTH_MODE: anonymous

  # Zero-config public HTTPS tunnel (Cloudflare "quick tunnel" - no account/token needed).
  # Claude's custom connector URL field requires a publicly reachable https:// endpoint;
  # it will not accept http://localhost. The generated URL is ephemeral and regenerates
  # on every restart - fetch it with `make connector-url`.
  #
  # SECURITY: while this service is running, the tunnel URL is reachable by anyone on the
  # internet who has it, and opcua-mcp has no authentication of its own. Only run this for
  # active local testing; stop the stack (`make compose-down`) when you're done.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--url", "http://opcua-mcp:8080"]
    depends_on:
      - opcua-mcp
    restart: unless-stopped
